name: Update profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  wave:
    name: Wave contribution graph
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate wave SVG
        uses: VuxDucGiang/wave@main
        with:
          github_user_name: 'zenith16f'
          output_path: 'profile/wave-commits.svg'
          color_palette: 'mono'
          animation_style: '2'

      - name: Commit wave SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/wave-commits.svg
          git commit -m "chore: update wave graph" || exit 0
          git push

  streak:
    name: Streak stats
    runs-on: ubuntu-latest
    needs: wave
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: git pull origin main

      - name: Generate streak SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: profile/streak.svg
          options: >-
            user=zenith16f
            &background=0d1117
            &stroke=30363d
            &ring=ffffff
            &fire=ffffff
            &currStreakNum=ffffff
            &sideNums=c9d1d9
            &currStreakLabel=8b949e
            &sideLabels=8b949e
            &dates=484f58
            &hide_border=true

      - name: Commit streak SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: update streak stats" || exit 0
          git push
