name: Update profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  wave:
    name: Wave contribution graph
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate wave SVG
        uses: VuxDucGiang/wave@main
        with:
          github_user_name: 'zenith16f'
          output_path: 'profile/wave-commits.svg'
          color_palette: 'mono'
          animation_style: '2'

      - name: Commit wave SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/wave-commits.svg
          git commit -m "chore: update wave graph" || exit 0
          git push
